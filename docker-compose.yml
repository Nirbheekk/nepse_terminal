name: nepse-terminal

services:
  postgres:
    image: postgres:16-alpine
    container_name: nepse-terminal-postgres
    environment:
      POSTGRES_USER: nepse
      POSTGRES_PASSWORD: nepse_local_dev
      POSTGRES_DB: nepse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nepse -d nepse"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: nepse-terminal-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://nepse:nepse_local_dev@postgres:5432/nepse?sslmode=disable
      JWT_SECRET: dev-secret-minimum-32-bytes-secure-nepse-platform
      ALLOWED_ORIGINS: http://localhost:3100
      COOKIE_SECURE: "false"
    ports:
      - "8081:8081"
    volumes:
      - ../data:/captured/data:ro
      - ../exports:/captured/exports:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: nepse-terminal-worker
    depends_on:
      api:
        condition: service_started
    command: ["/app/worker", "-role", "promote", "-interval", "5m"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://nepse:nepse_local_dev@postgres:5432/nepse?sslmode=disable
      JWT_SECRET: dev-secret-minimum-32-bytes-secure-nepse-platform
    volumes:
      - ../data:/captured/data:ro
      - ../exports:/captured/exports:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
    container_name: nepse-terminal-web
    depends_on:
      api:
        condition: service_started
    ports:
      - "3100:3100"
    restart: unless-stopped

volumes:
  pgdata:
