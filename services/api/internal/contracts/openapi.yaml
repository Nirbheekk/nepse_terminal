  /api/v1/disclosures:
    get:
      tags: [disclosures]
      summary: List authorized disclosures from NEPSE, SEBON, NRB and companies
      parameters:
        - name: authority
          in: query
          schema: { type: string, enum: [NEPSE, SEBON, NRB, COMPANY] }
        - name: symbol
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200": { description: List of disclosures with attachments and licensing metadata }
    post:
      tags: [disclosures]
      summary: Ingest authorized disclosure with attachments
      responses:
        "201": { description: Disclosure created }

  /api/v1/disclosures/{id}:
    get:
      tags: [disclosures]
      summary: Get single disclosure by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Disclosure details }
        "404": { description: Not found }

  /api/v1/research/query:
    post:
      tags: [research]
      summary: Evidence-grounded AI research assistant with tripartite facts, calculations, and interpretations
      responses:
        "200": { description: Evidence-grounded research response with source citations }
        "400": { description: Invalid query }
        "401": { description: Unauthorized (portfolio scope without auth) }
        "403": { description: Forbidden (cross-tenant portfolio access) }

  /api/v1/workspaces:
    get:
      tags: [institutional]
      summary: List institutional workspaces (organizations) for the authenticated user
      responses:
        "200": { description: List of organizations }
        "401": { description: Unauthenticated }
    post:
      tags: [institutional]
      summary: Create institutional organization workspace
      responses:
        "201": { description: Organization created }
        "401": { description: Unauthenticated }

  /api/v1/workspaces/{orgId}/members:
    get:
      tags: [institutional]
      summary: List members and RBAC roles of an organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Members list }
        "403": { description: Forbidden }
    post:
      tags: [institutional]
      summary: Add or update organization member role (requires org_admin)
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Member added }
        "403": { description: Forbidden }

  /api/v1/workspaces/{orgId}/portfolios:
    get:
      tags: [institutional]
      summary: List all portfolios owned by the organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Org portfolios }
        "403": { description: Forbidden }
    post:
      tags: [institutional]
      summary: Create portfolio scoped to organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Portfolio created }
        "403": { description: Forbidden }

  /api/v1/workspaces/{orgId}/notes:
    get:
      tags: [institutional]
      summary: List research notes in institutional workspace
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: symbol
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200": { description: Research notes }
        "403": { description: Forbidden }
    post:
      tags: [institutional]
      summary: Create research note
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Note created }
        "403": { description: Forbidden }

  /api/v1/workspaces/{orgId}/approvals:
    get:
      tags: [institutional]
      summary: List pending or past approval requests
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200": { description: Approval requests }
        "403": { description: Forbidden }

  /api/v1/workspaces/{orgId}/approvals/{id}/review:
    post:
      tags: [institutional]
      summary: Review approval request (compliance officer / org admin only, anti-self-approval enforced)
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Review processed }
        "403": { description: Forbidden (including self-approval attempt) }

  /api/v1/workspaces/{orgId}/portfolios/{portfolioId}/liquidity:
    get:
      tags: [institutional]
      summary: Liquidity risk analysis (ADV, days to liquidate, liquidity tiers, slippage estimate)
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: portfolioId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Liquidity report }
        "403": { description: Forbidden }

  /api/v1/workspaces/{orgId}/portfolios/{portfolioId}/concentration:
    get:
      tags: [institutional]
      summary: Concentration risk analysis (Top-1/3/5/10, HHI, SEBON single stock & sector limit breaches)
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: portfolioId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Concentration report }
        "403": { description: Forbidden }

  /api/v1/workspaces/{orgId}/portfolios/{portfolioId}/stress:
    post:
      tags: [institutional]
      summary: Multi-factor stress testing and scenario analysis
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: portfolioId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Scenario stress testing result }
        "403": { description: Forbidden }

  /api/v1/workspaces/{orgId}/portfolios/{portfolioId}/export.csv:
    get:
      tags: [institutional]
      summary: Export institutional portfolio positions and risk metrics to CSV (gated by PermReportExport)
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: portfolioId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: CSV export }
        "403": { description: Forbidden if role lacks PermReportExport }

  /api/v1/workspaces/{orgId}/audit:
    get:
      tags: [institutional]
      summary: List immutable audit trail events
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Audit logs }
        "403": { description: Forbidden }

  /api/v1/developer/licensing-matrix:
    get:
      tags: [developer]
      summary: Retrieve data provider licensing terms and redistribution policies
      security: []
      responses:
        "200":
          description: Data licensing matrix mapping datasets to rights, permitted redistribution and attribution requirements

  /api/v1/developer/keys:
    get:
      tags: [developer]
      summary: List issued developer API keys for authenticated caller
      responses:
        "200": { description: List of developer keys }
        "401": { description: Unauthenticated }
    post:
      tags: [developer]
      summary: Generate a new cryptographic developer API key (np_live_...)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                tier: { type: string, enum: [free, pro, institutional, enterprise] }
                org_id: { type: string, format: uuid }
      responses:
        "201": { description: Key created; returns plaintext api_secret once }
        "400": { description: Invalid parameters }
        "401": { description: Unauthenticated }

  /api/v1/developer/keys/{id}:
    delete:
      tags: [developer]
      summary: Revoke an issued developer API key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Key revoked }
        "401": { description: Unauthenticated }
        "404": { description: Key not found }

  /api/v1/exports:
    get:
      tags: [developer]
      summary: List data export jobs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200": { description: List of export jobs }
        "401": { description: Unauthenticated }
    post:
      tags: [developer]
      summary: Submit a dataset export request (CSV, JSON, Parquet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset]
              properties:
                dataset: { type: string, enum: [companies, daily_ohlcv, floorsheet, financials, disclosures, analytics, market_live] }
                format: { type: string, enum: [csv, json, parquet], default: csv }
                org_id: { type: string, format: uuid }
                parameters: { type: object }
      responses:
        "201": { description: Export job created and queued }
        "400": { description: Invalid request }
        "401": { description: Unauthenticated }
        "403": { description: Bulk redistribution prohibited by licensing terms }

  /api/v1/exports/{id}:
    get:
      tags: [developer]
      summary: Get status, checksum and row count of an export job
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Export job details }
        "401": { description: Unauthenticated }
        "404": { description: Job not found }

  /api/v1/exports/{id}/download:
    get:
      tags: [developer]
      summary: Download formatted export data file with license attribution headers
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: File download stream (text/csv, application/json, or application/octet-stream for Parquet)
          headers:
            X-Licensing-Class: { schema: { type: string } }
            X-Attribution-Notice: { schema: { type: string } }
        "400": { description: Job not ready }
        "401": { description: Unauthenticated }
        "404": { description: Job not found }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: np_at
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Envelope:
      type: object
      required: [data, meta, error]
      properties:
        data: {}
        meta: { $ref: "#/components/schemas/Meta" }
        error:
          oneOf:
            - { $ref: "#/components/schemas/APIError" }
            - { type: "null" }
    Meta:
      type: object
      properties:
        request_id: { type: string }
        as_of: { type: string, description: RFC 3339 timestamp of the underlying data }
        source: { type: string }
        license_class:
          type: string
          enum: [official_verified, third_party_licensed, public_unverified, derived, restricted, unavailable]
        freshness:
          type: string
          description: |
            live = captured under 2 minutes ago while open; delayed = under 15
            minutes; final = the exchange is closed and this stored session will
            not change again; stale = a capture is older than the session it
            should describe.
          enum: [live, delayed, final, stale, unknown]
        freshness_reason: { type: string }
        market_state: { type: string, enum: [open, preopen, closed, unknown] }
        session_date: { type: string, format: date }
        age_seconds: { type: integer }
        calculation: { type: string }
        coverage: { $ref: "#/components/schemas/Coverage" }
        total: { type: integer }
        next_cursor: { type: string }
    Coverage:
      type: object
      properties:
        covered: { type: integer }
        eligible: { type: integer }
        unit: { type: string }
    APIError:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        details: {}
    Summary:
      type: object
      properties:
        trading_date: { type: string, format: date }
        nepse_index: { type: string }
        point_change: { type: string }
        percent_change: { type: string }
        turnover: { type: string }
        transactions: { type: integer, format: int64 }
        traded_securities: { type: integer }
        advanced: { type: integer }
        declined: { type: integer }
        unchanged: { type: integer }
        market_cap: { type: string }
        float_market_cap: { type: string }
        cap_method: { type: string }
    Mover:
      type: object
      properties:
        symbol: { type: string }
        name: { type: string }
        close: { type: string }
        previous_close: { type: string }
        change: { type: string }
        percent_change: { type: string }
        volume: { type: string }
        turnover: { type: string }
    Company:
      type: object
      properties:
        symbol: { type: string }
        name: { type: string }
        sector: { type: string }
        sector_code: { type: string }
        status: { type: string }
        instrument: { type: string }
        close: { type: string }
        previous_close: { type: string }
        change: { type: string }
        percent_change: { type: string }
        volume: { type: string, description: Session quantity traded }
        turnover: { type: string }
        transactions: { type: string }
        listed_shares: { type: string }
        public_shares: { type: string }
        market_cap:
          type: string
          description: Close multiplied by listed shares, or the reported figure when shares are unknown
        market_cap_method:
          type: string
          enum: [close_x_listed_shares, reported_at_previous_close, unavailable]
        market_cap_reported:
          type: string
          description: The exchange's own marketCapitalization field; computed at the previous close
        market_cap_reported_basis: { type: string, enum: [previous_close] }
        float_market_cap: { type: string }
        float_market_cap_method:
          type: string
          enum: [close_x_public_shares, unavailable]
        trading_date: { type: string, format: date }
        ingested_at: { type: string, format: date-time }
    MarketStatus:
      type: object
      properties:
        state: { type: string, enum: [open, preopen, closed, unknown] }
        reported_status: { type: string, description: Verbatim value from the feed }
        as_of: { type: [string, "null"], format: date-time }
        observed_at: { type: [string, "null"], format: date-time }
        age_seconds: { type: [integer, "null"] }
        session_date: { type: string, format: date }
        is_open: { type: boolean }
        is_current_session: { type: boolean }
    Overview:
      type: object
      properties:
        summary: { $ref: "#/components/schemas/Summary" }
        status:
          oneOf:
            - { $ref: "#/components/schemas/MarketStatus" }
            - { type: "null" }
        movers:
          type: object
          properties:
            gainers: { type: array, items: { $ref: "#/components/schemas/Mover" } }
            losers: { type: array, items: { $ref: "#/components/schemas/Mover" } }
            turnover: { type: array, items: { $ref: "#/components/schemas/Mover" } }
        indices: { type: array, items: { type: object } }
        generated_at: { type: string, format: date-time }
    Bar:
      type: object
      properties:
        trading_date: { type: string, format: date }
        open: { type: string }
        high: { type: string }
        low: { type: string }
        close: { type: string }
        previous_close: { type: string }
        volume: { type: string }
        turnover: { type: string }
        transactions: { type: string }
        market_cap: { type: string }
    Trade:
      type: object
      properties:
        contract_id: { type: string }
        trading_date: { type: string, format: date }
        symbol: { type: string }
        buyer_broker: { type: [string, "null"] }
        seller_broker: { type: [string, "null"] }
        quantity: { type: string }
        rate: { type: string }
        amount: { type: string }
        executed_at: { type: [string, "null"], format: date-time }
    ScreenCondition:
      type: object
      required: [metric, op, value]
      properties:
        metric: { type: string, description: A key from /api/v1/screener/metrics }
        op: { type: string, enum: [gt, gte, lt, lte, eq, between] }
        value: { type: number }
        value_to: { type: number, description: Required only when op is between }
        min_bars: { type: integer, description: Overrides the metric's history requirement }
    ScreenRule:
      type: object
      properties:
        universe:
          type: object
          properties:
            sectors: { type: array, items: { type: string } }
            instruments: { type: array, items: { type: string } }
            statuses: { type: array, items: { type: string } }
            symbols: { type: array, items: { type: string } }
            search: { type: string }
        all:
          type: array
          items: { $ref: "#/components/schemas/ScreenCondition" }
        any:
          type: array
          items: { $ref: "#/components/schemas/ScreenCondition" }
        sort: { type: string, description: symbol, name, sector or a metric key }
        order: { type: string, enum: [asc, desc] }
        limit: { type: integer, minimum: 1, maximum: 500 }
        min_bars: { type: integer, description: Gate every technical metric at this history depth }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        roles:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
    DeveloperKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, example: "np_live_8f3a12" }
        tier: { type: string, enum: [free, pro, institutional, enterprise] }
        rate_limit_rpm: { type: integer }
        monthly_quota: { type: integer }
        requests_this_month: { type: integer }
        quota_reset_at: { type: string, format: date-time }
        allowed_ips: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
    ExportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        dataset: { type: string }
        format: { type: string, enum: [csv, json, parquet] }
        status: { type: string, enum: [pending, processing, completed, failed, cancelled] }
        row_count: { type: integer }
        file_size_bytes: { type: integer }
        file_name: { type: string }
        sha256: { type: string }
        license_class: { type: string }
        attribution: { type: string }
