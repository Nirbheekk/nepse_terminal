      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: symbol
          in: query
          schema: { type: string }
      responses:
        "200": { description: Tax lots }

  /api/v1/portfolios/{id}/analytics:
    get:
